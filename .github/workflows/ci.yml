name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are up to date
        run: |
          pnpm --filter @dinemate/api-client gen
          git diff --exit-code packages/api-client/src/generated
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build

  api:
    name: API (ruff, pytest with Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dinemate
          POSTGRES_PASSWORD: dinemate
          POSTGRES_DB: dinemate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dinemate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DINEMATE_TEST_DATABASE_URL: postgresql+psycopg://dinemate:dinemate@localhost:5432/dinemate_test
      DINEMATE_REQUIRE_DB_TESTS: "1"
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Models and migrations agree
        run: uv run alembic check
        env:
          DINEMATE_DATABASE_URL: postgresql+psycopg://dinemate:dinemate@localhost:5432/dinemate_test
      - name: OpenAPI spec is up to date
        run: |
          uv run python -m app.openapi_export ../../packages/api-client/openapi.json
          git diff --exit-code ../../packages/api-client/openapi.json

  e2e:
    name: E2E (Playwright demo flows)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dinemate
          POSTGRES_PASSWORD: dinemate
          POSTGRES_DB: dinemate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dinemate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --directory services/api
      - run: pnpm --filter @dinemate/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  vision:
    name: Vision (ruff, counting tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vision
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uvx ruff@0.17.0 check .
      - run: uvx ruff@0.17.0 format --check .
      - run: uv run --no-project --python 3.12 --with pytest --with numpy --with httpx pytest -q

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - run: curl --fail --silent --show-error http://localhost:8000/api/v1/health
      - run: curl --fail --silent --show-error http://localhost:8000/api/v1/student/summary | grep -q '"canteens"'
      - run: 'curl --fail --silent --show-error -X POST -H ''Content-Type: application/json'' -d ''{"email":"admin@dinemate.test","password":"dinemate-demo-pass"}'' http://localhost:8000/api/v1/auth/login | grep -q access_token'
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs api simulator
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  business-compose:
    name: Business local server smoke test
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      DINEMATE_JWT_SECRET: ci-only-jwt-secret-for-the-business-smoke-test
      DINEMATE_TEMPLATE_KEY: 7Qn1W1n3V2aJ6o4m0cQy7hYk3m9pHk2kCq0yWn3Jg2E=
      DINEMATE_LIVE_LINK_SECRET: ci-live-link-secret
      DINEMATE_SIMULATOR_TOKEN: ci-simulator-token
      DINEMATE_HUB_TOKEN: ci-hub-token
      DINEMATE_SETUP_PASSWORD: ci-owner-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.business.yml up -d --build --wait
      - run: >-
          docker compose -f infra/docker-compose.business.yml exec -T -e DINEMATE_SETUP_PASSWORD -e DINEMATE_HUB_TOKEN api
          python -m app.business.setup create --org "CI Cafe Group" --venue "CI Cafe" --owner-email owner@ci.test
          --password-env DINEMATE_SETUP_PASSWORD --hub-token-env DINEMATE_HUB_TOKEN
      - run: curl --fail --silent --show-error http://localhost:8080/ | grep -q '<div id="root">'
      - run: curl --fail --silent --show-error http://localhost:8080/cameras | grep -q '<div id="root">'
      - run: 'curl --fail --silent --show-error -X POST -H ''Content-Type: application/json'' -d ''{"email":"owner@ci.test","password":"ci-owner-password"}'' http://localhost:8080/api/v1/auth/login | grep -q access_token'
      - run: 'curl --fail --silent --show-error -H "Authorization: Device ci-hub-token" http://localhost:8080/api/v1/devices/hub-local/hub/cameras | grep -q ''"cameras":\[\]'''
      - if: always()
        run: docker compose -f infra/docker-compose.business.yml logs api web
      - if: always()
        run: docker compose -f infra/docker-compose.business.yml down -v
