name: dinemate

x-api-env: &api-env
  DINEMATE_ENVIRONMENT: ${DINEMATE_ENVIRONMENT:-development}
  DINEMATE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dinemate}:${POSTGRES_PASSWORD:-dinemate}@db:5432/${POSTGRES_DB:-dinemate}
  DINEMATE_CORS_ORIGINS: ${DINEMATE_CORS_ORIGINS:-["http://localhost:5173","http://localhost:5174"]}
  DINEMATE_SIMULATION_MODE: ${DINEMATE_SIMULATION_MODE:-true}
  DINEMATE_DEMO_CLOCK_START: ${DINEMATE_DEMO_CLOCK_START:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dinemate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dinemate}
      POSTGRES_DB: ${POSTGRES_DB:-dinemate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../services/api
    environment:
      <<: *api-env
      DINEMATE_MIGRATE_ON_START: "true"
      DINEMATE_SEED_IF_EMPTY: ${DINEMATE_SEED_IF_EMPTY:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  simulator:
    build: ../services/api
    command: ["python", "-m", "app.sim"]
    environment:
      <<: *api-env
      DINEMATE_SIMULATOR_INTERVAL_S: ${DINEMATE_SIMULATOR_INTERVAL_S:-30}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
